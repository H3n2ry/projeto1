<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="area.css" />
    <title>area do profissional</title>
  </head>
  <body>
    <header>
      <!-- Header: representa o cabeçalho da página -->

      <img
        src="./img/ChatGPT Image 18 de set. de 2026, 21_43_28.png"
        alt="logo"
      />
    </header>

    <main align="center">
      <!-- Main: concentra o conteúdo principal da página -->

      <h1>agenda do profissional</h1>
      <section>
        <!-- Section: agrupa o conteúdo relacionado aos horários marcados -->

        <h2>horarios marcados</h2>

        <article>
          <!-- Cada article representa um atendimento independente,
             com suas próprias informações -->

          <h3>Renan</h3>
          <!-- Time: representa uma informação relacionada a horário -->

          <h4>Serviços</h4>
          <p>Corte - R$30,00</p>
          <p>Barba - R$15,00</p>

          <p>Duração: 1h30</p>
        </article>

        <article>
          <h3>Julia</h3>
          <time>10:30</time>

          <h4>Serviços</h4>
          <p>Unha simples - R$35,00</p>

          <p>Duração: 1h30</p>
        </article>

        <article>
          <h3>neymara</h3>
          <time>11:30</time>

          <h4>Serviços</h4>
          <p>progressiva - R$150,00</p>

          <p>Duração: 2h30</p>
        </article>
      </section>

      <nav>
        <!-- Nav: contém os links de navegação entre as páginas -->

        <a href="#">home</a>
        <a href="#">agenda</a>
        <a href="#">salao</a>
        <a href="#">perfil</a>
      </nav>
    </main>
  </body>
</html>
